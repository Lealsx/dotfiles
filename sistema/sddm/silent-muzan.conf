; Tema "muzan" — feito para combinar com o Hyprland (Demon Slayer, carmesim e brasa)
; https://github.com/uiriansan/SilentSDDM/wiki/Customizing

[General]
scale = 1.0
enable-animations = true
animated-background-placeholder = "muzan.png"
background-fill-mode = "fill"

[LockScreen]
display = true
padding-top = 0
padding-right = 0
padding-bottom = 0
padding-left = 0
background = "muzan.mp4"
use-background-color = false
background-color = "#000000"
blur = 0
brightness = -0.05
saturation = 0.0
input-keystroke = false
ignore-shift-key = false

[LockScreen.Clock]
display = true
position = "top-center"
align = "center"
format = "hh:mm"
font-family = "JetBrainsMono Nerd Font"
font-size = 70
font-weight = 900
color = "#f5ecee"

[LockScreen.Date]
display = true
format = "dddd, dd 'de' MMMM"
locale = "pt_BR"
font-family = "JetBrainsMono Nerd Font"
font-size = 14
font-weight = 600
color = "#ff7b5c"
margin-top = -15

[LockScreen.Message]
display = true
position = "bottom-center"
align = "center"
text = "Pressione qualquer tecla"
font-family = "JetBrainsMono Nerd Font"
font-size = 12
font-weight = 400
display-icon = true
icon = "enter.svg"
icon-size = 16
color = "#f5ecee"
paint-icon = true
spacing = 0

[LoginScreen]
background = "muzan.mp4"
use-background-color = false
background-color = "#000000"
blur = 24
brightness = -0.25
saturation = 0.0

[LoginScreen.LoginArea]
position = "center"
margin = -1

[LoginScreen.LoginArea.Avatar]
shape = "circle"
border-radius = 35
active-size = 120
inactive-size = 80
inactive-opacity = 0.35
active-border-size = 0
inactive-border-size = 0
active-border-color = "#e3123b"
inactive-border-color = "#ff7b5c"
always-active = false

[LoginScreen.LoginArea.Username]
font-family = "JetBrainsMono Nerd Font"
font-size = 16
font-weight = 700
color = "#f5ecee"
margin = 10

[LoginScreen.LoginArea.PasswordInput]
width = 200
height = 30
display-icon = true
font-family = "JetBrainsMono Nerd Font"
font-size = 12
icon = "password.svg"
icon-size = 16
content-color = "#f5ecee"
background-color = "#0a0608"
background-opacity = 0.6
border-size = 0
border-color = "#e3123b"
border-radius-left = 10
border-radius-right = 10
margin-top = 10
masked-character = "●"

[LoginScreen.LoginArea.LoginButton]
background-color = "#e3123b"
background-opacity = 0.85
active-background-color = "#ff7b5c"
active-background-opacity = 1.0
icon = "arrow-right.svg"
icon-size = 18
content-color = "#f5ecee"
active-content-color = "#0a0608"
border-size = 0
border-color = "#e3123b"
border-radius-left = 10
border-radius-right = 10
margin-left = 5
show-text-if-no-password = true
hide-if-not-needed = false
font-family = "JetBrainsMono Nerd Font"
font-size = 12
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "Entrando"
font-family = "JetBrainsMono Nerd Font"
font-weight = 600
font-size = 14
icon-size = 30
icon = "spinner.svg"
color = "#ff7b5c"
spacing = 5

[LoginScreen.LoginArea.WarningMessage]
font-family = "JetBrainsMono Nerd Font"
font-size = 11
font-weight = 400
normal-color = "#f5ecee"
warning-color = "#ff7b5c"
error-color = "#e3123b"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 50
margin-right = 50
margin-bottom = 50
margin-left = 50
size = 30
border-radius = 5
spacing = 10
font-family = "JetBrainsMono Nerd Font"

[LoginScreen.MenuArea.Popups]
max-height = 300
item-height = 30
item-spacing = 2
padding = 5
display-scrollbar = true
margin = 5
background-color = "#1e0f13"
background-opacity = 0.92
active-option-background-color = "#e3123b"
active-option-background-opacity = 0.6
content-color = "#f5ecee"
active-content-color = "#f5ecee"
font-family = "JetBrainsMono Nerd Font"
border-size = 0
border-color = "#e3123b"
font-size = 11
icon-size = 16

[LoginScreen.MenuArea.Session]
display = true
position = "bottom-left"
index = 0
popup-direction = "up"
popup-align = "center"
display-session-name = true
button-width = 200
popup-width = 200
background-color = "#e3123b"
background-opacity = 0.0
active-background-opacity = 0.6
content-color = "#f5ecee"
active-content-color = "#f5ecee"
border-size = 0
font-size = 10
icon-size = 16

[LoginScreen.MenuArea.Layout]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 180
display-layout-name = true
background-color = "#e3123b"
background-opacity = 0.0
active-background-opacity = 0.6
content-color = "#f5ecee"
active-content-color = "#f5ecee"
border-size = 0
font-size = 10
icon = "language.svg"
icon-size = 16

[LoginScreen.MenuArea.Keyboard]
display = true
position = "bottom-right"
index = 0
background-color = "#e3123b"
background-opacity = 0.0
active-background-opacity = 0.6
content-color = "#f5ecee"
active-content-color = "#f5ecee"
border-size = 0
icon = "keyboard.svg"
icon-size = 16

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 100
background-color = "#e3123b"
background-opacity = 0.0
active-background-opacity = 0.6
content-color = "#f5ecee"
active-content-color = "#f5ecee"
border-size = 0
icon = "power.svg"
icon-size = 16

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = "login"
start-hidden = true
background-color = "#FFFFFF"
background-opacity = 0.15
key-content-color = "#FFFFFF"
key-color = "#FFFFFF"
key-opacity = 0.15
key-active-background-color = "#FFFFFF"
key-active-opacity = 0.30
selection-background-color = "#CCCCCC"
selection-content-color = "#FFFFFF"
primary-color = "#e3123b"
border-size = 0
border-color = "#000000"
restrict-input = "none"

[Tooltips]
enable = true
font-family = "JetBrainsMono Nerd Font"
font-size = 11
content-color = "#f5ecee"
background-color = "#1e0f13"
background-opacity = 0.15
border-radius = 5
disable-user = false
disable-login-button = false
