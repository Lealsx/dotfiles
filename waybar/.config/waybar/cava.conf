# =============================================================
#  cava.conf — visualizador de música da barra
# =============================================================
#  O cava "escuta" o som que está tocando (pelo PipeWire) e
#  devolve a altura de cada barrinha, de 0 a 7. O script
#  hypr/scripts/visualizador.sh transforma isso em ▁▂▃▄▅▆▇█.
# =============================================================

[general]
# quantidade de barrinhas na barra
bars = 10
# quadros por segundo (mais = mais suave, mas gasta mais)
framerate = 30
# ajusta a altura sozinho conforme o volume da música
autosens = 1
# sensibilidade em % (100 = padrão). Menor = barras mais baixas,
# batem menos no topo (█). Se ficar baixo demais, suba aos poucos.
sensitivity = 70

[input]
method = pipewire
source = auto

[output]
# "raw" = só números, sem desenhar nada no terminal
method = raw
raw_target = /dev/stdout
data_format = ascii
# altura máxima = 7 (8 alturas: ▁ a █)
ascii_max_range = 7
# separador entre as barras: 59 = ";"
bar_delimiter = 59

[smoothing]
# suaviza o movimento (0–100). Maior = mais calmo, menos "pulo"
noise_reduction = 85
# liga as barras vizinhas em formato de onda, sem picos isolados
monstercat = 1
