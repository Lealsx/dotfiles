# =============================================================
#  kitty — terminal (Super + Enter)
#  Ctrl+Shift+T nova aba | Ctrl+Shift+Enter dividir | Ctrl+Shift+= / - zoom
# =============================================================

font_family      JetBrainsMono Nerd Font
font_size        12.0

background_opacity 0.92
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam
tab_bar_style powerline

# --- Cores: fundo preto + carmesim/brasa do Muzan (base Catppuccin) ---
foreground              #f5ecee
background              #0a0608
selection_foreground    #ffffff
selection_background    #e3123b
cursor                  #e3123b
cursor_text_color       #0a0608
url_color               #ff7b5c
active_tab_foreground   #ffffff
active_tab_background   #e3123b
inactive_tab_foreground #f5ecee
inactive_tab_background #1e0f13

# preto
color0  #45475a
color8  #585b70
# vermelho
color1  #e3123b
color9  #ff4d6d
# verde
color2  #a6e3a1
color10 #a6e3a1
# amarelo
color3  #f9e2af
color11 #f9e2af
# azul
color4  #89b4fa
color12 #89b4fa
# magenta
color5  #f5c2e7
color13 #f5c2e7
# ciano
