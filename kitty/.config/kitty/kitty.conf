# =============================================================
#  kitty — terminal (Super + Enter)
#  Ctrl+Shift+T nova aba | Ctrl+Shift+Enter dividir | Ctrl+Shift+= / - zoom
# =============================================================

font_family      JetBrainsMono Nerd Font
font_size        12.0

background_opacity 0.92
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam
tab_bar_style powerline

# --- Cores principais: as do álbum tocando (cores.conf, gerado pelo tema musical)
# ou as do Muzan (cores-muzan.conf) quando não há álbum ---
include cores.conf

# preto
color0  #45475a
color8  #585b70
# vermelho
color1  #e3123b
color9  #ff4d6d
# verde
color2  #a6e3a1
color10 #a6e3a1
# amarelo
color3  #f9e2af
color11 #f9e2af
# azul
color4  #89b4fa
color12 #89b4fa
# magenta
color5  #f5c2e7
color13 #f5c2e7
# ciano
color6  #94e2d5
color14 #94e2d5
# branco
color7  #bac2de
color15 #a6adc8
