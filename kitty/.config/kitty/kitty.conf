# =============================================================
#  kitty — terminal (Super + Enter)
#  Ctrl+Shift+T nova aba | Ctrl+Shift+Enter dividir | Ctrl+Shift+= / - zoom
# =============================================================

font_family      JetBrainsMono Nerd Font
font_size        12.0

background_opacity 0.92
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam
tab_bar_style powerline

# --- Cores: fundo preto + vermelho/ciano do Miles Morales (base Catppuccin) ---
foreground              #f4f4f6
background              #0d0d12
selection_foreground    #ffffff
selection_background    #ff2a4f
cursor                  #ff2a4f
cursor_text_color       #0d0d12
url_color               #00d8ff
active_tab_foreground   #ffffff
active_tab_background   #ff2a4f
inactive_tab_foreground #f4f4f6
inactive_tab_background #1f1f29

# preto
color0  #45475a
color8  #585b70
# vermelho
color1  #ff2a4f
color9  #ff5c76
# verde
color2  #a6e3a1
color10 #a6e3a1
# amarelo
color3  #f9e2af
color11 #f9e2af
# azul
color4  #89b4fa
color12 #89b4fa
# magenta
color5  #f5c2e7
color13 #f5c2e7
# ciano
color6  #00d8ff
color14 #5ce6ff
# branco
color7  #bac2de
color15 #a6adc8
