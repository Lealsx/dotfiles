# =============================================================
#  hyprlock.conf — tela de bloqueio (Super + L)
# =============================================================
#  Esc ou Ctrl+U apagam a senha digitada.
# =============================================================

$fonte = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# Fundo: um print da tela, desfocado
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

# Hora
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $fonte
    color = rgb(cdd6f4)
    position = 0, 160
    halign = center
    valign = center
}

# Data em português (ex.: terça-feira, 17 de novembro)
label {
    monitor =
    text = cmd[update:60000] LC_TIME=pt_BR.UTF-8 date +"%A, %d de %B"
    font_size = 22
    font_family = $fonte
    color = rgb(a6adc8)
    position = 0, 60
    halign = center
    valign = center
}

# Campo de senha
input-field {
    monitor =
    size = 300, 55
    outline_thickness = 2
    rounding = 12

    inner_color = rgba(1e1e2ecc)
    outer_color = rgba(89b4faee) rgba(cba6f7ee) 45deg
    check_color = rgba(a6e3a1ee)
    fail_color  = rgba(f38ba8ee)
    font_color  = rgb(cdd6f4)

    font_family = $fonte
    placeholder_text = Digite sua senha...
    fail_text = Senha incorreta ($ATTEMPTS)
    fade_on_empty = false
    dots_spacing = 0.3

    position = 0, -40
    halign = center
    valign = center
}

# Teclado atual (clique para trocar US ⇄ BR)
label {
    monitor =
    text = 󰌌  $LAYOUT[US,BR]
    font_size = 14
    font_family = $fonte
    color = rgb(a6adc8)
    onclick = hyprctl switchxkblayout all next
    position = 0, -110
    halign = center
    valign = center
}
