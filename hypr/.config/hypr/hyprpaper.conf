# =============================================================
#  hyprpaper.conf — papel de parede
# =============================================================
#  Para trocar: coloque a imagem em ~/Imagens e mude o "path".
#  fit_mode = cover → preenche a tela sem distorcer
# =============================================================

wallpaper {
    monitor =
    path = /usr/share/hypr/wall2.png
    fit_mode = cover
}

splash = false
