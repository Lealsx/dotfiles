# =============================================================
#  hypridle.conf — o que acontece quando você fica parado
# =============================================================
#   2,5 min → diminui o brilho
#   5 min   → bloqueia a tela
#   5,5 min → desliga a tela
#   20 min  → suspende o notebook
# =============================================================

general {
    lock_cmd = pidof hyprlock || hyprlock                             # não abre dois bloqueios
    before_sleep_cmd = loginctl lock-session                          # bloqueia antes de suspender
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # liga a tela ao voltar
}

listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10   # salva o brilho atual e diminui
    on-resume = brightnessctl -r           # volta o brilho
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
